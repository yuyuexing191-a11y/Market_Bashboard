[project]
name = "market-dashboard"
version = "0.1.0"
description = "A-share market dashboard data importer"
requires-python = ">=3.11"
dependencies = [
  "akshare>=1.16,<2",
  "alembic>=1.13,<2",
  "fastapi>=0.115,<1",
  "pandas>=2.0,<3",
  "psycopg[binary]>=3.1,<4",
  "python-dotenv>=1,<2",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.30,<1",
]

[dependency-groups]
dev = [
  "httpx2>=2,<3",
  "pytest>=8,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["app*", "scripts*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
